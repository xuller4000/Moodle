<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>HM Moodle Cookie-Sync</title>
<style>
  body { font: 14px/1.4 "Segoe UI", system-ui, sans-serif; width: 340px; margin: 0; padding: 14px; color: #1f1f1f; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  button { flex: 1; padding: 6px; font: inherit; cursor: pointer; }
  #status { margin-top: 12px; padding: 8px; border-radius: 6px; background: #f2f2f2; }
  #status.ok { background: #e6f4ea; }
  #status.bad { background: #fde8e8; }
  .hint { color: #5f5f5f; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
  <h1>HM Moodle Cookie-Sync</h1>
  <label for="url">Connector-Adresse (Setup- oder MCP-URL)</label>
  <input id="url" type="password" placeholder="https://moodle-connector.….workers.dev/…/setup" autocomplete="off">
  <div class="row">
    <button id="save">Speichern</button>
    <button id="sync">Jetzt synchronisieren</button>
  </div>
  <div id="status">Noch kein Status.</div>
  <p class="hint">Die Erweiterung überträgt das Moodle-Cookie automatisch, sobald du dich in Edge bei moodle.hm.edu anmeldest, und prüft alle 15 Minuten den Connector. Nicht bei Moodle abmelden, einfach den Tab schließen.</p>
  <script src="popup.js"></script>
</body>
</html>
