name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONNECTOR_SECRET: ${{ secrets.CONNECTOR_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      - name: Check secrets
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CONNECTOR_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::GitHub secret $v fehlt"; exit 1; fi
          done
          if [ ${#CONNECTOR_SECRET} -lt 24 ]; then echo "::error::CONNECTOR_SECRET muss mindestens 24 Zeichen haben"; exit 1; fi

      - name: Find or create KV namespace
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          TITLE="moodle-connector-session"
          ID=$(curl -sf -H "$AUTH" "$API?per_page=100" | jq -r --arg t "$TITLE" '.result[] | select(.title==$t) | .id')
          if [ -z "$ID" ]; then
            ID=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" -d "{\"title\":\"$TITLE\"}" "$API" | jq -r '.result.id')
          fi
          test -n "$ID" && test "$ID" != "null"
          sed -i "s/__KV_ID__/$ID/" wrangler.jsonc

      - run: npx wrangler deploy
      - run: printf '%s' "$CONNECTOR_SECRET" | npx wrangler secret put CONNECTOR_SECRET
